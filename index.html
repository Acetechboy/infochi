<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قیمت و موجودی فروشگاه</title>
<style>
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --ink:#17212B; --muted:#5F6C79; --line:#D6DCE2;
  --brand:#1D3B5E; --brand-ink:#FFFFFF;
  --chg:#8F5300; --chg-bg:#FFF1D6; --chg-line:#E0A23C;
  --ok:#1B7550; --ok-bg:#E1F2E9;
  --out:#A8342D; --out-bg:#FAE6E3;
  --inf:#44586C; --inf-bg:#E4EAF0;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F151B; --surface:#18212A; --ink:#E7ECF1; --muted:#95A2AF; --line:#2B3744;
    --brand:#8DB4E2; --brand-ink:#0E1620;
    --chg:#F0B45A; --chg-bg:#3A2B10; --chg-line:#B37A22;
    --ok:#6FD1A2; --ok-bg:#16332A;
    --out:#F2918A; --out-bg:#3A1C1A;
    --inf:#A9BBCD; --inf-bg:#223040;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Vazirmatn","Vazir","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:15px; line-height:1.7; padding-bottom:150px;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.wrap{max-width:720px; margin:0 auto; padding:0 14px}

header.top{padding:18px 0 8px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
header.top h1{margin:0; font-size:22px; font-weight:700; line-height:1.4}
header.top .sub{margin:2px 0 0; color:var(--muted); font-size:13px}
header.top .sub bdi{direction:ltr}

.btn{
  height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); font-weight:600; white-space:nowrap;
}
.btn.primary{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
.btn.small{height:38px; padding:0 12px; font-size:14px}

.tools{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 10px}
.search{
  width:100%; height:46px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); padding:0 14px; font-size:16px;
}
.filters{display:flex; gap:8px; margin-top:8px; align-items:center}
.filters select{
  flex:1; min-width:0; height:40px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); padding:0 10px; font-size:14px;
}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; height:38px; padding:0 12px; font-size:14px}
.seg button + button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand); color:var(--brand-ink); font-weight:700}

#list{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.p + .p{border-top:1px solid var(--line)}
.p.chg{box-shadow:inset 4px 0 0 var(--chg-line)}
.head{
  display:block; width:100%; text-align:start; border:0; background:transparent;
  padding:14px 14px 12px;
}
.top-row{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.nm{font-weight:700; font-size:16px; line-height:1.5}
.pr{display:flex; flex-direction:column; white-space:nowrap; font-variant-numeric:tabular-nums; line-height:1.55; text-align:end}
.pr .a{font-weight:700}
.pr .b{font-size:13px; color:var(--muted)}
.pr small{font-weight:400; color:var(--muted); font-size:12px; margin-inline-end:4px}
.meta{display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; margin:2px 0 10px}
.badge{background:var(--chg-bg); color:var(--chg); border-radius:6px; padding:0 8px; font-size:12px; font-weight:700}
.strip{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.cell{flex:1; min-width:0; text-align:center; padding:5px 0 6px; line-height:1.35}
.cell + .cell{border-inline-start:1px solid var(--line)}
.cell b{display:block; font-size:14px}
.cell i{display:block; font-style:normal; font-size:13px}
.cell.ok{background:var(--ok-bg); color:var(--ok)}
.cell.out{background:var(--out-bg); color:var(--out)}
.cell.inf{background:var(--inf-bg); color:var(--inf)}
.cell.chg{box-shadow:inset 0 -3px 0 var(--chg-line)}

.panel{display:grid; grid-template-rows:0fr; transition:grid-template-rows .2s ease}
.p.open .panel{grid-template-rows:1fr}
.panel > .inner{overflow:hidden; min-height:0}
.p:not(.open) .inner{visibility:hidden}
.inner-pad{padding:2px 14px 16px; border-top:1px dashed var(--line); margin:0 0 0}
.row-type{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:12px}
.row-type label,.bulk label{font-weight:600; font-size:14px}
.row-type select{height:40px; border-radius:8px; border:1px solid var(--line); background:var(--surface); padding:0 10px; min-width:130px; font-size:15px}
.note{margin:6px 0 0; font-size:13px; color:var(--muted)}
.bulk{padding-top:14px}
.bulk-in{display:flex; gap:8px; margin-top:6px}
.shead,.srow{display:grid; grid-template-columns:40px 1fr 140px; gap:8px; align-items:center}
.shead{margin-top:14px; font-size:12px; color:var(--muted); padding-bottom:4px}
.shead span:nth-child(2),.shead span:nth-child(3){text-align:center}
.srow{padding:6px 0; border-top:1px solid var(--line)}
.sz{font-weight:700; text-align:center}
.num{
  width:100%; height:42px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); text-align:center; font-size:16px; padding:0 6px;
  font-variant-numeric:tabular-nums; min-width:0;
}
.num.chg{border-color:var(--chg-line); background:var(--chg-bg); color:var(--chg); font-weight:700}
.step{display:flex; direction:ltr; gap:6px}
.step .num{flex:1}
.sb{width:40px; height:42px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:20px; line-height:1; flex:none}
.sb:active{background:var(--inf-bg)}

.sizes{margin-top:14px; border-top:1px solid var(--line)}
.sblock{padding:10px 0}
.sblock + .sblock{border-top:1px solid var(--line)}
.line1{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
.line2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pf{display:block}
.pf span{display:block; font-size:12px; color:var(--muted); margin-bottom:2px}
.bt{font-weight:600; font-size:14px; margin-bottom:6px}
.apply{width:100%; margin-top:8px}
.line1 .step{width:152px; flex:none}
.empty{padding:36px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); margin-bottom:4px}

#bar{
  position:fixed; inset-inline:0; bottom:0; z-index:10; background:var(--surface);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
#bar .in{max-width:720px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
#bar .txt{flex:1 1 100%; min-width:0; line-height:1.4}
#bar .txt strong{font-size:15px; margin-inline-end:8px}
#bar .txt span{font-size:12px; color:var(--muted)}
#bar .btn{flex:1; padding:0 8px}
#toast{
  position:fixed; inset-inline:14px; top:12px; z-index:20; margin:0 auto; max-width:420px;
  background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:14px;
  text-align:center; opacity:0; transform:translateY(-8px); pointer-events:none;
  transition:opacity .2s, transform .2s;
}
#toast.show{opacity:1; transform:none}
@media (prefers-reduced-motion: reduce){
  .panel,#toast{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>قیمت و موجودی</h1>
      <p class="sub"><bdi>avalchi.ir</bdi> <span id="stats"></span></p>
      <p class="sub" id="rule"></p>
    </div>
    <button class="btn small" id="importBtn" type="button">بارگذاری فایل</button>
    <input type="file" id="file" accept=".xlsx" hidden>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="جستجوی نام یا دسته" aria-label="جستجو">
    <div class="filters">
      <select id="cat" aria-label="دسته"></select>
      <div class="seg" role="group" aria-label="نمایش">
        <button type="button" data-mode="all" aria-pressed="true">همه</button>
        <button type="button" data-mode="out" aria-pressed="false">ناموجود</button>
        <button type="button" data-mode="chg" aria-pressed="false">تغییرکرده</button>
      </div>
    </div>
  </div>

  <main id="list"><div class="empty">در حال بارگذاری…</div></main>
</div>

<div id="bar" hidden>
  <div class="in">
    <div class="txt"><strong id="barTitle"></strong><span>تغییرها در همین مرورگر ذخیره می‌شن؛ برای میکسین خروجی اکسل بگیر</span></div>
    <button class="btn small" id="undo" type="button">لغو تغییرها</button>
    <button class="btn small" id="save" type="button">ذخیره تغییرها</button>
    <button class="btn primary" id="export" type="button">خروجی اکسل</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

const latin = s => String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d));

function setup(d, b){
  const hm=d.main.headers, hv=d.vars.headers, ix=(h,n)=>h.indexOf(n);
  const m={id:ix(hm,'شناسه'),name:ix(hm,'نام'),cat:ix(hm,'نام دسته اصلی'),price:ix(hm,'قیمت (تومان)'),stock:ix(hm,'موجودی'),type:ix(hm,'نوع موجودی'),unit:ix(hm,'قیمت هر عدد')};

  if([m.id,m.name,m.price,m.stock,m.type].some(i=>i<0) || (d.vars.rows.length && [v.pid,v.vid,v.size,v.price,v.stock].some(i=>i<0)))
    throw new Error('ستون‌های لازم در فایل پیدا نشد');
  data=d; baseData=b||clone(d); cm=m; cv=v;
  baseMain=new Map(baseData.main.rows.map(r=>[r[cm.id],r]));

  const g=new Map();
  data.vars.rows.forEach(r=>{const k=r[cv.pid]; if(!g.has(k)) g.set(k,[]); g.get(k).push(r);});

const typeOf = p => p.row[cm.type] || 'محدود';
const stateOf = (p,stock) => { const t=typeOf(p); if(t==='ناموجود') return 'out'; if(t==='نامحدود') return 'inf'; return stock>0?'ok':'out'; };
const sizeNum = v => parseInt(latin(v[cv.size]),10) || 0;
const sorted = p => p.vrows.slice().sort((a,b)=>sizeNum(a)-sizeNum(b));
const prices = p => p.vrows.length ? p.vrows.map(v=>v[cv.price]) : [p.row[cm.price]];

const vPriceChg = v => { const b=baseVar.get(v[cv.vid]); return !b || b[cv.price]!==v[cv.price]; };
const vStockChg = v => { const b=baseVar.get(v[cv.vid]); return !b || b[cv.stock]!==v[cv.stock]; };
const vChg = v => vPriceChg(v)||vStockChg(v);
const mPriceChg = p => { const b=baseMain.get(p.id); return !b || b[cm.price]!==p.row[cm.price]; };
const mStockChg = p => { const b=baseMain.get(p.id); return !b || b[cm.stock]!==p.row[cm.stock]; };
const mChg = p => { const b=baseMain.get(p.id); if(!b) return true; if(b[cm.type]!==p.row[cm.type]) return true; return p.vrows.length ? false : (mPriceChg(p)||mStockChg(p)); };
const pChg = p => mChg(p) || p.vrows.some(vChg);

function syncMain(p){
  if(!p.vrows.length) return;
  const d = p.vrows.find(v=>v[cv.def]==1) || p.vrows[0];
  p.row[cm.price]=d[cv.price];
  if(cm.unit>=0) p.row[cm.unit]=d[cv.price];
  p.row[cm.stock]=d[cv.stock];
}

function stripHTML(p){
  if(!p.vrows.length){

  }
  return sorted(p).map(v=>{
    const s=v[cv.stock]||0, st=stateOf(p,s);

}

function panelHTML(p){

  const cats=[...new Set(products.map(p=>p.row[cm.cat]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fa'));
  const sel=$('#cat');
  sel.innerHTML='<option value="">همه دسته‌ها</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value=cats.includes(cat)?cat:''; cat=sel.value;
}

function updateStats(){
  let sizes=0, out=0;
  products.forEach(p=>{
    const rows=p.vrows.length?p.vrows.map(v=>v[cv.stock]||0):[p.row[cm.stock]||0];
    if(p.vrows.length) sizes+=rows.length;
    rows.forEach(s=>{ if(stateOf(p,s)==='out') out++; });
  });
  $('#stats').textContent = `${fmt(products.length)} محصول، ${fmt(sizes)} سایز، ${fmt(out)} ناموجود`;
}

function updateBar(){
  const n=products.filter(pChg).length;
  bar.hidden = n===0;
  $('#barTitle').textContent = `${fmt(n)} محصول تغییر کرده`;
  updateStats();
}

function renderAll(){
  const vis=products.filter(visible);
  if(vis.length){ list.innerHTML=vis.map(prodHTML).join(''); }
  else if(mode==='chg'){ list.innerHTML='<div class="empty"><strong>هنوز چیزی تغییر نکرده</strong>یک محصول را باز کن و قیمت یا تعداد را عوض کن.</div>'; }
  else { list.innerHTML='<div class="empty"><strong>محصولی پیدا نشد</strong>جستجو یا فیلتر را عوض کن.</div>'; }
  updateBar();
}

function rerender(p){
  const el=list.querySelector(`.p[data-id="${String(p.id).replace(/"/g,'')}"]`);
  if(el) el.outerHTML=prodHTML(p);
}
function commit(p){ rerender(p); updateBar(); persist(); }

let toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3200); }

const KEY='avalchi-state-v2';
let saveT;
async function writeState(){
  const json=JSON.stringify({data,baseData});
  let ok=false;
  try{ if(window.storage){ await window.storage.set(KEY,json,false); ok=true; } }catch(e){}
  if(!ok){ try{ localStorage.setItem(KEY,json); ok=true; }catch(e){} }
  return ok;
}
function persist(){ clearTimeout(saveT); saveT=setTimeout(writeState,300); }
async function saveNow(){
  clearTimeout(saveT);
  const ok=await writeState();
  const time=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  toast(ok ? `تغییرها ذخیره شد (ساعت ${time})` : 'ذخیره نشد؛ مرورگر اجازه‌ی ذخیره نمی‌دهد');
}
async function restore(){
  try{ if(window.storage){ const r=await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
function applyPreset(){
  products.forEach(p=>{
    p.row[cm.type]='محدود';
    if(p.vrows.length){ p.vrows.forEach(v=>v[cv.stock]=1); syncMain(p); }
    else p.row[cm.stock]=1;
  });
}

function findV(p,id){ return p.vrows.find(v=>String(v[cv.vid])===String(id)); }
function setAllPrices(p,n){
  if(p.vrows.length){ p.vrows.forEach(v=>v[cv.price]=n); syncMain(p); }
  else { p.row[cm.price]=n; if(cm.unit>=0) p.row[cm.unit]=n; }
}
function applyBulk(art,p){
  let n=parseNum(art.querySelector('[data-f="bulkTorob"]').value);
  if(n==null){ const m=parseNum(art.querySelector('[data-f="bulkMain"]').value); if(m!=null) n=torobOf(m); }
  if(n==null){ toast('قیمت را وارد کن'); return; }
  setAllPrices(p,n); commit(p);
}

list.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const art=b.closest('.p'); if(!art) return;
  const p=byId.get(art.dataset.id); if(!p) return;
  const act=b.dataset.act;
  if(act==='toggle'){ const k=String(p.id); open.has(k)?open.delete(k):open.add(k); rerender(p); return; }
  if(act==='bulk'){ applyBulk(art,p); return; }
  if(act==='inc'||act==='dec'){
    const d=act==='inc'?1:-1;
    if(b.dataset.v){ const v=findV(p,b.dataset.v); if(!v) return; v[cv.stock]=Math.max(0,Math.min(99999,(v[cv.stock]||0)+d)); syncMain(p); }
    else { p.row[cm.stock]=Math.max(0,Math.min(99999,(p.row[cm.stock]||0)+d)); }
    commit(p);
  }
});
list.addEventListener('change',e=>{
  const el=e.target.closest('[data-f]'); if(!el) return;
  const art=el.closest('.p'); const p=art && byId.get(art.dataset.id); if(!p) return;
  const f=el.dataset.f;
  if(f==='bulkMain'||f==='bulkTorob') return;
  if(f==='type'){ p.row[cm.type]=el.value; commit(p); return; }
  const n=parseNum(el.value);
  if(n==null){ rerender(p); return; }
  if(f==='vmain'||f==='vtorob'||f==='vstock'){
    const v=findV(p,el.dataset.v); if(!v){ rerender(p); return; }
    if(f==='vstock') v[cv.stock]=n; else v[cv.price]=(f==='vmain'?torobOf(n):n);
    syncMain(p);
  } else if(f==='mmain'||f==='mtorob'){
    const price=(f==='mmain'?torobOf(n):n);
    p.row[cm.price]=price; if(cm.unit>=0) p.row[cm.unit]=price;
  } else if(f==='mstock'){ p.row[cm.stock]=n; }
  commit(p);
});
list.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const el=e.target.closest('[data-f]'); if(!el) return;
  e.preventDefault();
  if(el.dataset.f==='bulkMain'||el.dataset.f==='bulkTorob'){ const art=el.closest('.p'); applyBulk(art,byId.get(art.dataset.id)); }
  else el.blur();
});
list.addEventListener('input',e=>{
  const el=e.target, f=el.dataset && el.dataset.f;
  if(f!=='bulkMain' && f!=='bulkTorob') return;
  const art=el.closest('.p'); if(!art) return;
  const other=art.querySelector(f==='bulkMain'?'[data-f="bulkTorob"]':'[data-f="bulkMain"]');
  const n=parseNum(el.value);
  other.value = n==null ? '' : fmt(f==='bulkMain' ? torobOf(n) : mainOf(n));
});
list.addEventListener('focusin',e=>{ if(e.target.matches && e.target.matches('input.num')) setTimeout(()=>e.target.select(),0); });

$('#q').addEventListener('input',e=>{ q=e.target.value.trim(); renderAll(); });
$('#cat').addEventListener('change',e=>{ cat=e.target.value; renderAll(); });
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  renderAll();
}));

$('#save').addEventListener('click',saveNow);

let undoArmed=false, undoT;
$('#undo').addEventListener('click',()=>{
  const btn=$('#undo');
  if(!undoArmed){ undoArmed=true; btn.textContent='تأیید لغو'; undoT=setTimeout(()=>{undoArmed=false; btn.textContent='لغو تغییرها';},3500); return; }
  clearTimeout(undoT); undoArmed=false; btn.textContent='لغو تغییرها';
  setup(clone(baseData), clone(baseData)); renderAll(); persist(); toast('تغییرها لغو شد');
});

let importArmed=false, importT;
$('#importBtn').addEventListener('click',()=>{
  if(products.some(pChg) && !importArmed){
    importArmed=true; toast('تغییرهای فعلی با فایل جدید جایگزین می‌شن. برای ادامه دوباره بزن');
    importT=setTimeout(()=>importArmed=false,4000); return;
  }
  clearTimeout(importT); importArmed=false; $('#file').click();
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(!window.XLSX){ toast('کتابخانه اکسل بارگذاری نشد؛ اتصال اینترنت را بررسی کن'); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const names=wb.SheetNames;
    const mainName=names.includes(SHEETS.main)?SHEETS.main:names[0];
    const varName=names.includes(SHEETS.vars)?SHEETS.vars:names[1];
    const read=n=>n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true}):[];
    const build=(n,fallbackHeaders)=>{
      const a=read(n), h=a[0]||fallbackHeaders;
      const rows=a.slice(1).filter(r=>r.some(c=>c!==null)).map(r=>{ r=r.slice(); while(r.length<h.length) r.push(null); return r; });
      return {name:n||'', headers:h, rows};
    };
    const d={main:build(mainName,[]), vars:build(varName,DATA0.vars.headers)};
    if(!varName) d.vars.name=SHEETS.vars;
    setup(d);
    open.clear(); q=''; $('#q').value=''; cat=''; mode='all';
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode==='all')));
    renderCats(); renderAll(); persist();
    toast(`${fmt(products.length)} محصول بارگذاری شد`);
  }catch(err){
    console.error(err);
    toast(err && err.message ? err.message : 'خواندن فایل ناموفق بود');
  }
});

$('#export').addEventListener('click',()=>{
  if(!window.XLSX){ toast('کتابخانه اکسل بارگذاری نشد؛ اتصال اینترنت را بررسی کن'); return; }
  try{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([data.main.headers,...data.main.rows]),data.main.name||SHEETS.main);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([data.vars.headers,...data.vars.rows]),data.vars.name||SHEETS.vars);
    wb.Workbook={Views:[{RTL:true}]};
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const t=new Date(), z=n=>String(n).padStart(2,'0');
    const name=`products_${t.getFullYear()}${z(t.getMonth()+1)}${z(t.getDate())}_${z(t.getHours())}${z(t.getMinutes())}${z(t.getSeconds())}.xlsx`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('فایل اکسل ساخته شد');
  }catch(err){ console.error(err); toast('ساخت فایل اکسل ناموفق بود'); }
});

(async()=>{
  const st=await restore();
  let fresh=false;
  try{ if(st && st.data && st.baseData) setup(st.data,st.baseData); else { setup(clone(DATA0)); fresh=true; } }
  catch(e){ setup(clone(DATA0)); fresh=true; }
  if(fresh){ applyPreset(); persist(); }
  $('#rule').textContent=`قیمت اصلی ${faDigits(Math.round(OFF*100))}٪ کمتر از ترب‌پی (تومان)`;
  renderCats(); renderAll();
})();
})();
</script>
</body>
